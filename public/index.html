<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf-token" content="__CSRF__" />
    <title>UI 测试 Agent</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到工作区</a>
    <aside class="sidebar" aria-label="测试轮次导航">
      <a class="brand" href="/"
        ><svg class="brand-mark" aria-hidden="true" viewBox="0 0 32 32" fill="none">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor" />
          <path
            d="m9 16 5 5 9-10"
            stroke="white"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        ><span>UI Test Agent<small>自动化测试工作台</small></span></a
      ><button id="new-task" class="primary wide">
        <svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16" fill="none">
          <path
            d="M10 4v12M4 10h12"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          /></svg
        >导入测试用例
      </button>
      <p class="eyebrow">项目与测试轮次</p>
      <div id="task-list"></div>
      <div class="side-bottom">
        <button id="demo" class="wide">体验跨业务演示</button>
        <p>使用本机合成数据，快速了解流程</p>
        <button id="settings" class="wide">DeepSeek 连接设置</button
        ><small id="provider-status">正在读取配置…</small>
      </div>
    </aside>
    <main id="main-content" tabindex="-1">
      <header class="topbar">
        <span class="workspace-label"
          >测试工作台 <span class="topbar-divider">/</span> 本机控制台</span
        ><span id="connection">DeepSeek 官方接口</span>
      </header>
      <div id="workspace"></div>
    </main>
    <dialog id="modal">
      <button class="modal-close" aria-label="关闭">×</button>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <input id="handoff-file" type="file" accept=".json" hidden /><input
      id="discovery-contract-file"
      type="file"
      accept=".json"
      hidden
    />
  </body>
</html>
