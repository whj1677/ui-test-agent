<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测试工作台 · 项目与用例</title>
  <link rel="stylesheet" href="/workspace/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <aside class="sidebar" aria-label="工作台导航">
      <a class="brand" href="#/projects" aria-label="测试工作台首页">
        <span class="brand-mark">W</span>
        <span><strong>测试工作台</strong><small>PROJECT WORKSPACE</small></span>
      </a>
      <nav class="side-nav">
        <a class="side-link active" href="#/projects"><span class="nav-icon">◇</span>项目</a>
        <span class="side-link disabled" aria-disabled="true"><span class="nav-icon">○</span>建例任务<small>本阶段未接入</small></span>
        <span class="side-link disabled" aria-disabled="true"><span class="nav-icon">□</span>执行记录<small>本阶段未接入</small></span>
      </nav>
      <div class="side-spacer"></div>
      <div class="connection"><span></span><div><strong>已连接本机工作台</strong><small>项目与用例管理</small></div></div>
      <a class="legacy-link" href="/">返回旧工作台</a>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div id="breadcrumbs" class="breadcrumbs"></div>
        <div class="top-status"><span id="service-dot"></span><span id="service-label">正在连接服务…</span></div>
      </header>
      <main id="main" class="content" tabindex="-1">
        <div id="page-loading" class="loading-panel"><span class="spinner"></span>正在读取真实后端数据…</div>
        <div id="app" hidden></div>
      </main>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="/workspace/app.js" type="module"></script>
</body>
</html>
