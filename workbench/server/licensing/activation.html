<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>激活测试工作台</title><link rel="stylesheet" href="/workspace/activation.css"></head><body><main><p class="eyebrow">测试工作台 · 设备授权</p><h1>在这台电脑上激活</h1><p>一次导入，长期使用。授权绑定主板；升级内存或硬盘不影响，更换主板需重新申请。</p><div id="status" role="status">正在读取授权状态…</div><section><h2>1. 导出设备申请</h2><label>使用者或单位名称<input id="display-name" maxlength="120" placeholder="填写用于授权登记的名称"></label><label class="check"><input id="consent" type="checkbox">同意读取主板标识并在本机生成设备指纹。申请文件包含填写的名称和指纹，不含主板原始序列号、账户、CPU或硬盘信息。</label><button id="export-request">下载设备申请</button><p class="hint">把申请文件交给软件提供方，取得签名授权文件。此页面不会自动上传。</p></section><section><h2>2. 导入授权文件</h2><label>授权文件<input id="license-file" type="file" accept=".json,application/json"></label><label class="check"><input id="replace" type="checkbox">更换主板或重新授权：用新文件替换本机已有授权</label><button id="import-license">验证并激活</button><p class="hint">授权会保存在当前 Windows 用户的本地应用数据目录。请保留一份授权文件，系统重装后可重新导入。</p></section><p class="hint">授权验证完成前，项目、测试执行和模型功能均不可用。DeepSeek 密钥与设备授权分别配置。</p></main><script src="/workspace/activation.js"></script></body></html>
