<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>实验设备预约调度台</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:180px 1fr;min-height:100vh}.side{background:#101827;color:#dbe7ff;padding:18px 12px}.brand{font-weight:800;margin:0 8px 18px;font-size:18px}.nav button{display:block;width:100%;margin:8px 0;padding:10px 12px;border:0;border-radius:10px;text-align:left;background:transparent;color:#cbd5e1;cursor:pointer}.nav button[aria-current='page']{background:#2563eb;color:#fff}.main{padding:18px 22px 40px}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;margin-bottom:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px #0001}.card b{display:block;font-size:22px;margin-top:4px}.card span{color:#64748b;font-size:12px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#475569;font-weight:700}input,select,button{font:inherit}input,select{border:1px solid #cbd5e1;border-radius:9px;padding:8px 9px;background:#fff}button{border:1px solid #cbd5e1;border-radius:9px;padding:8px 12px;background:#fff;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb;color:#fff}button.danger{background:#dc2626;border-color:#dc2626;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.dd{position:relative}.dd button{min-width:96px}.dd ul{position:absolute;z-index:5;top:38px;left:0;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px #0002;min-width:110px}.dd li{padding:8px 10px;border-radius:8px;cursor:pointer}.dd li[aria-selected='true'],.dd li:hover{background:#eff6ff}.checks{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid #cbd5e1;border-radius:9px}.checks label{display:flex;gap:4px;align-items:center;font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:left;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:12px}.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px}.idle{background:#dcfce7;color:#166534}.busy{background:#fee2e2;color:#991b1b}.maint{background:#fef3c7;color:#92400e}.empty{padding:34px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:12px}.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}.msg{min-height:22px;color:#b91c1c;font-weight:700;margin:8px 0}.ok{color:#047857}.mask{position:fixed;inset:0;background:#0f172a66;display:none;z-index:20}.mask.show{display:block}.drawer{position:fixed;right:0;top:0;height:100%;width:430px;max-width:92vw;background:#fff;box-shadow:-8px 0 28px #0003;transform:translateX(105%);transition:.2s;z-index:30;padding:18px;overflow:auto}.drawer.open{transform:none}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button[aria-selected='true']{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.modal{position:fixed;inset:0;display:none;place-items:center;z-index:40;background:#0f172a66}.modal.show{display:grid}.dialog{width:760px;max-width:94vw;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 18px 50px #0005}.steps{display:flex;gap:8px;margin-bottom:14px}.step{padding:6px 10px;border-radius:999px;background:#e2e8f0;color:#475569}.step.on{background:#2563eb;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.hint{color:#64748b;font-size:12px}.sr{position:absolute;left:-9999px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:flex;gap:8px;align-items:center}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}</style></head><body><div class='app'><aside class='side'><div class='brand'>实验设备调度台</div><nav class='nav' aria-label='主导航'><button id='navDev' aria-current='page'>设备资源</button><button id='navRec'>预约记录</button><button id='resetDemo' class='danger' style='margin-top:24px'>重置演示数据</button></nav></aside><main class='main'><section class='stats' aria-label='统计'><div class='card'><span>设备总数</span><b id='statTotal'>8</b></div><div class='card'><span>可预约设备</span><b id='statIdle'>5</b></div><div class='card'><span>已确认预约</span><b id='statConf'>1</b></div><div class='card'><span>已确认收入</span><b id='statFee'>40</b></div></section><section id='devView' class='panel' aria-labelledby='devTitle'><h1 id='devTitle' style='margin:0 0 10px;font-size:20px'>设备资源</h1><div class='toolbar'><div class='field'><label for='q'>搜索编号或名称</label><input id='q' type='search' placeholder='如 eq-101 或 温循箱'></div><div class='field'><label id='siteLab'>站点</label><div class='dd'><button id='siteBtn' aria-haspopup='listbox' aria-expanded='false' aria-labelledby='siteLab siteBtn'>全部</button><ul id='siteList' role='listbox' aria-labelledby='siteLab' hidden><li role='option' tabindex='0' data-v='全部' aria-selected='true'>全部</li><li role='option' tabindex='0' data-v='北站'>北站</li><li role='option' tabindex='0' data-v='南站'>南站</li><li role='option' tabindex='0' data-v='西站'>西站</li></ul></div></div><div class='field'><label>状态多选</label><div class='checks' role='group' aria-label='状态多选'><label><input type='checkbox' id='stIdle' value='空闲' checked>空闲</label><label><input type='checkbox' id='stBusy' value='使用中'>使用中</label><label><input type='checkbox' id='stMaint' value='维护'>维护</label></div></div><div class='field'><label for='sort'>排序</label><select id='sort'><option value='id'>编号升序</option><option value='feeDesc'>费用降序</option><option value='feeAsc'>费用升序</option></select></div><button id='resetFilter'>重置</button><button id='batchBook' class='primary' disabled>批量预约</button></div><div id='selInfo' class='hint' aria-live='polite'>已选 0 项；跨页选择会保留，筛选变化会清空并回到第1页。</div><div class='tablewrap'><table aria-label='设备列表'><thead><tr><th><input id='pageAll' type='checkbox' aria-label='当前页全选可预约行'></th><th>编号</th><th>名称</th><th>站点</th><th>状态</th><th>费用(元/小时)</th><th>操作</th></tr></thead><tbody id='devBody'></tbody></table></div><div id='devEmpty' class='empty' hidden>没有匹配设备</div><div class='pager'><span id='pageInfo' aria-live='polite'></span><button id='prev'>上一页</button><button id='next'>下一页</button></div></section><section id='recView' class='panel' aria-labelledby='recTitle' hidden><h1 id='recTitle' style='margin:0 0 10px;font-size:20px'>预约记录</h1><div class='tablewrap'><table aria-label='预约记录'><thead><tr><th>预约号</th><th>设备</th><th>时间</th><th>申请人</th><th>用途</th><th>总价</th><th>状态</th><th>操作</th></tr></thead><tbody id='recBody'></tbody></table></div><div id='recEmpty' class='empty' hidden>暂无预约记录</div></section></main></div><div id='mask' class='mask'></div><aside id='drawer' class='drawer' role='dialog' aria-modal='true' aria-labelledby='drawerTitle'><div style='display:flex;justify-content:space-between;align-items:center'><h2 id='drawerTitle' style='margin:0;font-size:18px'>设备详情</h2><button id='drawerClose' aria-label='关闭详情'>关闭</button></div><div id='drawerMsg' class='hint'>加载中…</div><div id='drawerBox' hidden><div id='drawerBasic'></div><div class='tabs' role='tablist' aria-label='详情页签'><button id='tabBasic' role='tab' aria-selected='true'>基本信息</button><button id='tabHis' role='tab' aria-selected='false'>预约历史</button></div><div id='tabPanel'></div></div></aside><div id='bookModal' class='modal'><div class='dialog' role='dialog' aria-modal='true' aria-labelledby='bookTitle'><div style='display:flex;justify-content:space-between;align-items:center'><h2 id='bookTitle' style='margin:0;font-size:19px'>新建预约</h2><button id='bookClose' aria-label='关闭预约弹窗'>关闭</button></div><div class='steps' aria-label='预约步骤'><span id='s1' class='step on'>1 资源</span><span id='s2' class='step'>2 时间用途</span><span id='s3' class='step'>3 确认</span></div><div id='bookMsg' class='msg' aria-live='assertive'></div><section id='step1'><h3>已选设备</h3><div id='selList' class='summary'></div><div class='actions'><button id='to2' class='primary'>下一步</button></div></section><section id='step2' hidden><div class='grid2'><div class='field'><label for='applicant'>申请人</label><input id='applicant' maxlength='30' placeholder='2到20字，去两端空白'></div><div class='field'><label for='date'>日期</label><input id='date' type='date' min='2026-10-10' max='2026-10-20' value='2026-10-10'></div><div class='field'><label for='start'>开始整点</label><select id='start'></select></div><div class='field'><label for='end'>结束整点</label><select id='end'></select></div></div><div class='field' style='margin-top:12px'><label for='purpose'>用途</label><input id='purpose' maxlength='120' placeholder='5到100字，去两端空白'></div><div class='hint'>时间限08:00-18:00，结束严格晚于开始，时长1-4小时；与已确认预约半开区间重叠禁止，紧接结束时刻允许。</div><div class='actions'><button id='back1'>返回</button><button id='to3' class='primary'>下一步</button></div></section><section id='step3' hidden><h3>确认信息</h3><div id='confirmBox' class='summary'></div><div class='actions'><button id='back2'>返回</button><button id='confirmBook' class='primary'>确认预约</button></div></section></div></div><script>const NS='kimi-complex-lab-v1',RKEY=NS+':reservations',SKEY=NS+':seq';const DEV=[{id:'EQ-101',name:'温循箱',site:'北站',status:'空闲',fee:80},{id:'EQ-102',name:'振动台',site:'北站',status:'维护',fee:50},{id:'EQ-103',name:'示波器',site:'南站',status:'空闲',fee:20},{id:'EQ-104',name:'温循箱',site:'南站',status:'使用中',fee:90},{id:'EQ-105',name:'电源柜',site:'北站',status:'空闲',fee:60},{id:'EQ-106',name:'示波器',site:'南站',status:'空闲',fee:30},{id:'EQ-107',name:'安规仪',site:'西站',status:'维护',fee:40},{id:'EQ-108',name:'电源柜',site:'西站',status:'空闲',fee:70}];const $=id=>document.getElementById(id);let reservations=[],seq=2,view='dev',page=1,sort='id',site='全部',q='',statuses=new Set(['空闲']),selected=new Set(),drawerTab='basic',creating=false,bookStep=1,draft={applicant:'',purpose:'',date:'2026-10-10',start:10,end:11};function seed(){reservations=[{id:'R-001',eq:'EQ-103',name:'示波器',site:'南站',applicant:'李明',purpose:'精度校准',date:'2026-10-10',start:10,end:12,hours:2,total:40,status:'已确认'}];seq=2;save()}function save(){localStorage.setItem(RKEY,JSON.stringify(reservations));localStorage.setItem(SKEY,String(seq))}function load(){if(!localStorage.getItem(RKEY)||!localStorage.getItem(SKEY))seed();else{try{reservations=JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){seed()}seq=parseInt(localStorage.getItem(SKEY),10)||2}}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmtTime(r){return r.date+' '+String(r.start).padStart(2,'0')+':00至'+String(r.end).padStart(2,'0')+':00'}function tag(st){return `<span class='tag ${st==='空闲'?'idle':st==='使用中'?'busy':'maint'}'>${st}</span>`}function filtered(){let a=DEV.slice();const t=q.trim().toLowerCase();if(t)a=a.filter(d=>d.id.toLowerCase().includes(t)||d.name.toLowerCase().includes(t));if(site!=='全部')a=a.filter(d=>d.site===site);a=a.filter(d=>statuses.has(d.status));if(sort==='feeDesc')a.sort((x,y)=>y.fee-x.fee||x.id.localeCompare(y.id));else if(sort==='feeAsc')a.sort((x,y)=>x.fee-y.fee||x.id.localeCompare(y.id));else a.sort((x,y)=>x.id.localeCompare(y.id));return a}function pages(a){return Math.max(1,Math.ceil(a.length/3))}function renderStats(){$('statTotal').textContent=DEV.length;$('statIdle').textContent=DEV.filter(d=>d.status==='空闲').length;const c=reservations.filter(r=>r.status==='已确认');$('statConf').textContent=c.length;$('statFee').textContent=c.reduce((s,r)=>s+r.total,0)}function renderDev(){const a=filtered(),p=pages(a);if(page>p)page=p;const rows=a.slice((page-1)*3,(page-1)*3+3);$('devBody').innerHTML=rows.map(d=>{const ok=d.status==='空闲',ck=ok?`<input type='checkbox' class='rowCk' data-id='${d.id}' aria-label='选择${d.id}' ${selected.has(d.id)?'checked':''}>`:`<input type='checkbox' disabled aria-label='${d.id}不可预约'>`;return `<tr><td>${ck}</td><td>${d.id}</td><td>${esc(d.name)}</td><td>${d.site}</td><td>${tag(d.status)}</td><td>${d.fee}</td><td><button class='detail' data-id='${d.id}'>详情</button></td></tr>`}).join('');$('devEmpty').hidden=a.length>0;const cur=rows.filter(d=>d.status==='空闲');$('pageAll').checked=cur.length>0&&cur.every(d=>selected.has(d.id));$('pageAll').disabled=cur.length===0;$('pageInfo').textContent=`共 ${a.length} 条，第 ${page}/${p} 页，每页3条`;$('prev').disabled=page<=1;$('next').disabled=page>=p;$('batchBook').disabled=selected.size===0;$('selInfo').textContent=`已选 ${selected.size} 项；跨页选择会保留，筛选变化会清空并回到第1页。`;renderStats()}function renderRec(){const a=reservations.slice().sort((x,y)=>x.id.localeCompare(y.id));$('recBody').innerHTML=a.map(r=>`<tr><td>${r.id}</td><td>${r.eq} ${esc(r.name)}</td><td>${fmtTime(r)}</td><td>${esc(r.applicant)}</td><td>${esc(r.purpose)}</td><td>${r.total}元</td><td>${r.status}</td><td><button class='recDetail' data-id='${r.id}'>详情</button> <button class='cancel danger' data-id='${r.id}' ${r.status!=='已确认'?'disabled':''}>取消预约</button></td></tr>`).join('');$('recEmpty').hidden=a.length>0;renderStats()}function filterChanged(){selected.clear();page=1;renderDev()}function switchView(v){view=v;$('navDev').setAttribute('aria-current',v==='dev'?'page':'false');$('navRec').setAttribute('aria-current',v==='rec'?'page':'false');$('devView').hidden=v!=='dev';$('recView').hidden=v!=='rec';if(v==='rec')renderRec()}function resetDemo(){if(confirm('确认重置演示数据？仅重置本演示命名空间 kimi-complex-lab-v1。')){Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k));seed();q='';site='全部';statuses=new Set(['空闲']);selected.clear();page=1;sort='id';$('q').value='';$('siteBtn').textContent='全部';$('stIdle').checked=true;$('stBusy').checked=false;$('stMaint').checked=false;$('sort').value='id';closeDrawer();closeBook();switchView('dev');renderDev()}}function openDrawer(title,fn){$('drawerTitle').textContent=title;$('drawerMsg').hidden=false;$('drawerBox').hidden=true;$('mask').classList.add('show');$('drawer').classList.add('open');setTimeout(()=>{fn();$('drawerMsg').hidden=true;$('drawerBox').hidden=false},260)}function closeDrawer(){$('drawer').classList.remove('open');$('mask').classList.remove('show')}function devDetail(id){const d=DEV.find(x=>x.id===id);drawerTab='basic';openDrawer('设备详情 '+d.id,()=>{renderDrawerTab();$('drawerBasic').innerHTML=`<p><b>编号：</b>${d.id}</p><p><b>名称：</b>${esc(d.name)}</p><p><b>站点：</b>${d.site}</p><p><b>状态：</b>${tag(d.status)}</p><p><b>费用：</b>${d.fee}元/小时</p>`});$('tabBasic').onclick=()=>{drawerTab='basic';renderDrawerTab()};$('tabHis').onclick=()=>{drawerTab='his';renderDrawerTab()};function renderDrawerTab(){$('tabBasic').setAttribute('aria-selected',drawerTab==='basic');$('tabHis').setAttribute('aria-selected',drawerTab==='his');if(drawerTab==='basic')$('tabPanel').innerHTML=$('drawerBasic').innerHTML;else{const h=reservations.filter(r=>r.eq===id);$('tabPanel').innerHTML=h.length?h.map(r=>`<p><b>${r.id}</b> ${fmtTime(r)} ${esc(r.applicant)} ${esc(r.purpose)} ${r.status}</p>`).join(''):'<p class=hint>无预约历史</p>'}}}function recDetail(id){const r=reservations.find(x=>x.id===id);openDrawer('预约详情 '+r.id,()=>{$('drawerBasic').innerHTML='';$('tabPanel').innerHTML=`<p><b>预约号：</b>${r.id}</p><p><b>设备：</b>${r.eq} ${esc(r.name)}</p><p><b>站点：</b>${r.site}</p><p><b>时间：</b>${fmtTime(r)}</p><p><b>申请人：</b>${esc(r.applicant)}</p><p><b>用途：</b>${esc(r.purpose)}</p><p><b>总价：</b>${r.total}元</p><p><b>状态：</b>${r.status}</p>`;$('tabBasic').setAttribute('aria-selected','true');$('tabHis').setAttribute('aria-selected','false')})}function openBook(){if(selected.size===0)return;bookStep=1;creating=false;draft={applicant:'',purpose:'',date:'2026-10-10',start:10,end:11};$('applicant').value='';$('purpose').value='';$('date').value='2026-10-10';fillHours();$('start').value='10';$('end').value='11';showStep(1);$('bookModal').classList.add('show')}function closeBook(){$('bookModal').classList.remove('show')}function fillHours(){let o='';for(let h=8;h<=18;h++)o+=`<option value='${h}'>${String(h).padStart(2,'0')}:00</option>`;$('start').innerHTML=o;$('end').innerHTML=o}function selDevs(){return DEV.filter(d=>selected.has(d.id)&&d.status==='空闲')}function showStep(n){bookStep=n;[1,2,3].forEach(i=>{$('step'+i).hidden=i!==n;$('s'+i).classList.toggle('on',i===n)});$('bookMsg').textContent='';if(n===1)$('selList').innerHTML=selDevs().map(d=>`<p>${d.id} ${esc(d.name)} ${d.site} ${d.fee}元/小时</p>`).join('');if(n===3)renderConfirm()}function validDraft(){const a=$('applicant').value.trim(),p=$('purpose').value.trim(),date=$('date').value,s=parseInt($('start').value,10),e=parseInt($('end').value,10);if(a.length<2||a.length>20)return '申请人必填，去两端空白后长度需为2到20字';if(p.length<5||p.length>100)return '用途必填，去两端空白后长度需为5到100字';if(date<'2026-10-10'||date>'2026-10-20')return '日期需在2026-10-10至2026-10-20含边界';if(!(s>=8&&s<=18&&e>=8&&e<=18))return '开始/结束需为08:00到18:00整点';if(e<=s)return '结束必须严格晚于开始';const dur=e-s;if(dur<1||dur>4)return '预约时长需为1到4小时';for(const d of selDevs()){for(const r of reservations){if(r.status==='已确认'&&r.eq===d.id&&r.date===date&&s<r.end&&r.start<e)return `${d.id} 在 ${date} ${String(s).padStart(2,'0')}:00-${String(e).padStart(2,'0')}:00 与已确认预约${r.id}冲突`}}draft={applicant:a,purpose:p,date:date,start:s,end:e};return ''}function renderConfirm(){const ds=selDevs(),dur=draft.end-draft.start,sum=ds.reduce((s,d)=>s+d.fee,0),total=sum*dur;$('confirmBox').innerHTML=ds.map(d=>`<p><b>${d.id}</b> ${esc(d.name)}｜${draft.date} ${String(draft.start).padStart(2,'0')}:00-${String(draft.end).padStart(2,'0')}:00｜申请人 ${esc(draft.applicant)}｜用途 ${esc(draft.purpose)}</p>`).join('')+`<hr><p><b>时长：</b>${dur}小时　<b>小时费合计：</b>${sum}元　<b>总价：</b>${total}元</p>`}function createBook(){if(creating)return;const err=validDraft();if(err){$('bookMsg').textContent=err;showStep(2);return}creating=true;$('confirmBook').disabled=true;const ds=selDevs(),dur=draft.end-draft.start,total=ds.reduce((s,d)=>s+d.fee,0)*dur;for(const d of ds){reservations.push({id:'R-'+String(seq).padStart(3,'0'),eq:d.id,name:d.name,site:d.site,applicant:draft.applicant,purpose:draft.purpose,date:draft.date,start:draft.start,end:draft.end,hours:dur,total:total,status:'已确认'})}seq+=ds.length;save();selected.clear();closeBook();switchView('rec');renderDev();renderRec()}document.addEventListener('click',e=>{const t=e.target;if(t.id==='navDev')switchView('dev');if(t.id==='navRec')switchView('rec');if(t.id==='resetDemo')resetDemo();if(t.id==='resetFilter'){q='';site='全部';statuses.clear();$('q').value='';$('siteBtn').textContent='全部';$('stIdle').checked=false;$('stBusy').checked=false;$('stMaint').checked=false;filterChanged()}if(t.id==='siteBtn'){const u=$('siteList'),exp=u.hidden;u.hidden=!exp;$('siteBtn').setAttribute('aria-expanded',exp)}if(t.closest&&t.closest('#siteList')&&t.getAttribute('role')==='option'){site=t.dataset.v;$('siteBtn').textContent=site;$('siteList').hidden=true;$('siteBtn').setAttribute('aria-expanded','false');filterChanged()}if(!t.closest||!t.closest('.dd')){$('siteList').hidden=true;$('siteBtn').setAttribute('aria-expanded','false')}if(t.classList&&t.classList.contains('rowCk')){t.checked?selected.add(t.dataset.id):selected.delete(t.dataset.id);renderDev()}if(t.id==='pageAll'){const a=filtered(),rows=a.slice((page-1)*3,(page-1)*3+3).filter(d=>d.status==='空闲');rows.forEach(d=>t.checked?selected.add(d.id):selected.delete(d.id));renderDev()}if(t.id==='prev'&&page>1){page--;renderDev()}if(t.id==='next'){const a=filtered();if(page<pages(a)){page++;renderDev()}}if(t.classList&&t.classList.contains('detail'))devDetail(t.dataset.id);if(t.classList&&t.classList.contains('recDetail'))recDetail(t.dataset.id);if(t.classList&&t.classList.contains('cancel')){const r=reservations.find(x=>x.id===t.dataset.id);if(r&&r.status==='已确认'&&confirm('确认取消预约 '+r.id+' ？取消后保留记录与总价并释放时间。')){r.status='已取消';save();renderRec();renderDev()}}if(t.id==='drawerClose'||t.id==='mask')closeDrawer();if(t.id==='batchBook')openBook();if(t.id==='bookClose')closeBook();if(t.id==='to2')showStep(2);if(t.id==='back1')showStep(1);if(t.id==='to3'){const err=validDraft();if(err){$('bookMsg').textContent=err}else showStep(3)}if(t.id==='back2')showStep(2);if(t.id==='confirmBook')createBook()});document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;filterChanged()}if(t.id==='sort'){sort=t.value;renderDev()}if(t.id==='stIdle'||t.id==='stBusy'||t.id==='stMaint'){statuses.clear();if($('stIdle').checked)statuses.add('空闲');if($('stBusy').checked)statuses.add('使用中');if($('stMaint').checked)statuses.add('维护');filterChanged()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeBook();$('siteList').hidden=true}if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='option'){e.preventDefault();e.target.click()}});load();renderDev();renderRec();</script></body></html>
