function importPage(){const step=state.importStep;let content='';if(step===1)content=`<section class="section"><div class="section-body"><div class="upload">${ico('upload')}<h2>导入已有用例</h2><p>Excel 或工作台原生包。可多次导入，也可组合其他项目的用例。</p><label class="btn primary" for="file-input">选择本机文件</label><input type="file" id="file-input" accept=".xlsx,.json" style="display:none" onchange="state.importFile=this.files[0]?.name||'';render()"><p>${state.importFile?esc(state.importFile)+' · 此稿不会解析文件内容':'拖放区与上传入口设计示意'}</p></div><div class="notice">本设计稿仅演示导入流程。正式产品调用既有后端解析、预览与确认接口，不使用示例数据替代用户文件。</div><div class="actions" style="margin-top:18px">${button('使用示例 Excel 预览',"state.importStep=2;render()",'')}${button('下载格式说明',"toast('正式界面下载后端适配的首版模板；本设计包不新增Excel模板。')",'quiet')}</div></div></section>`;else if(step===2)content=`<section class="section"><div class="section-head"><h2>核对字段映射</h2>${tag('示例：预约回归用例.xlsx')}</div><div class="section-body"><div class="formgrid">${[['用例编号','编号'],['用例名称','测试项'],['模块','业务模块'],['步骤','操作步骤'],['预期','预期结果'],['前置条件','前置说明']].map(([t,v])=>`<div class="field"><span>${t}</span><select aria-label="${t}映射"><option>${v}</option></select></div>`).join('')}</div><div class="notice">按原始物理行列保留文本。步骤与预期错位时明确定位；不猜测合并单元格归属，不删除数字样文本。</div></div></section>`;else if(step===3)content=`<div class="summaryline"><span><b>6</b> 条识别</span><span><b>4</b> 可导入</span><span><b>1</b> 待澄清</span><span><b>1</b> 无法导入</span></div><section class="section"><div class="section-head"><h2>原文预览</h2><span class="tiny muted">上传确认不会启动脚本生成</span></div><table><thead><tr><th>原始位置</th><th>用例</th><th>动作</th><th>预期</th><th>状态</th></tr></thead><tbody><tr><td>第2行 / A–F列</td><td>IMP-001 单设备预约</td><td>确认预约并刷新</td><td>记录与金额保持</td><td>${tag('可导入','good')}</td></tr><tr><td>第4行 / D列第2行</td><td>IMP-002 返回列表</td><td>点击返回</td><td>（缺失）</td><td>${tag('待澄清','warn')}</td></tr><tr><td>第7行 / E列第3行</td><td>IMP-003 详情字段</td><td>（缺失）</td><td>显示 220.5 kW</td><td>${tag('无法导入','bad')}</td></tr></tbody></table><div class="helpmini">另外3条可导 return `<div class="narrow">${crumbs([esc(project().name),'<a href="#cases">用例库</a>','导入'])}${heading('导入用例','确认原文后再入库。Excel与原生包共用项目用例库。') }<div class="stepper">${['选择文件','字段映射','预览与处理','完成'].map((x,i)=>`<div class="${step===i+1?'active':step>i+1?'done':''}"><b>${step>i+1?'✓':i+1}</b>${x}</div>`).join('')}</div>${content}${step<4?`<div class="wizard-bottom">${button(step===1?'取消':'上一步',step===1?"go('cases')":"state.importStep--;render()")}${button(step===3?'确认示例分流':step===1?'查看示例字段映射':'查看原文预览','state.importStep++;render()','primary')}</div>`:''}</div>`}

 <div class="outcome ${c.result==='通过'?'good':''}"><span class="status-icon">${c.result==='通过'?'✓':missing?'—':'×'}</span><div><h2>${missing?'本版本尚未执行':c.result==='通过'?'本次执行通过':'本次执行未通过'}</h2><p>${missing?'准备好脚本与环境后，明确发起执行。不会借用其他用例结果。':'示例状态：保留原始执行结果；要求核对和脚本资格单独记录。'}</p></div></div>

 <section class="section" style="margin-top:18px"><div class="empty"><h2>${missing?'没有本次执行证据':'该设计样例未配置媒体'}</h2><p>${caseRunTemplateNotice}</p><div class="actions" style="justify-content:center">${button('查看本例脚本',`go('case/${c.id}?tab=script')`,'primary')}${button('查看完整媒体布局样例',"state.batch='batch-02';go('case/CASE-023?tab=results')")}</div></div></section>`;
}
function runningPage(id){const b=batches.find(x=>x.id===id)||batches[0];return crumbs([esc(project().name),'<a href="#batches">测试批次</a>','运行中'])+heading(b.name,'进度状态设计示意 · 不表示已启动真实浏览器或模型',button('取消本批','cancelDemoBatch()','danger'))+`<div class="stagebox"><h2>正在运行第 2 / ${Math.max(2,b.executed)} 条</h2><p class="muted">用已有脚本串行执行。当前是设计稿进度示例，实际生产进度必须来源于后端事件。</p><div class="bar"><i style="width:12%"></i></div><div class="meta"><span>请求范围<b>${b.planned} 条</b></span><span>模型调用<b>0</b></span><span>软件版本<b>${b.version}</b></span></div></div><div class="progress-grid"><section class="section"><div class="section-head"><h2>冻结的执行清单</h2><span class="tiny muted">新脚本不会替换本批已绑定版本</span></div><table><thead><tr><th>用例</th><th>脚本</th><th>进度</th></tr></thead><tbody>${b.caseIds.slice(0,6).map((id,i)=>`<tr><td>${id}　${cases.find(c=>c.id===id).title}</td><td>S2</td><td>${i===0?result('通过'):tag(i===1?'执行中':'等待执行',i===1?'warn':'')}</td></tr>`).join('')}</tbody></table></section><div><div class="notice"><strong>失败后继续</strong><br>单条业务失败不停止无依赖的其他用例。共享环境异常才阻塞相应范围。</div><div class="notice" style="margin-top:16px"><strong>取消不会抹掉结果</strong><br>已执行记录保留，剩余项标明未执行及原因。</div>${button('预览完成态',`go('batch/${b.id}')`,'primary')}</div></div>`}
function cancelDemoBatch(){toast('取消流程设计：保留已完成事实，其余项标为取消未执行；本稿未真实运行任务。')}

function invalidObject(t,d){return crumbs([esc(project().name),'无法打开'])+heading(t,d)+`<section class='section'><div class='empty'><h2>${t}</h2><p>${d}</p>${button('返回用例库',"go('cases')",'primary')}${button('查看测试批次',"go('batches')")}</div></section>`}
function render(){const r=parseRoute();state.route=r.name;$('#main').className=r.name==='case'?'case-page':'';sidebar(r.name);const pages={projects:projectPage,cases:casePage,case:()=>casePageDetail(r),import:importPage,batches:batchPage,batch:()=>batchDetail(r.id),running:()=>runningPage(r.id),reports:reportPage,environment:envPage,settings:settingsPage,generation:()=>generationPage(r.id)};$('#main').innerHTML=(pages[r.name]||casePage)();if(r.name==='cases')updateCaseRows();if(r.name==='case'&&state.caseTab==='results')renderMedia();}
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
